# ============================================================
#  GitHub Actions: Release
#
#  Trigger:
#    - push tag matching v*  (e.g. v1.0.0) -> build + publish GitHub Release
#    - workflow_dispatch        -> build only (dry-run / re-build)
#
#  Pipeline:
#    1. Checkout
#    2. Setup Go 1.26.5 (project minimum per go.mod)
#    3. go vet ./...           (gate)
#    4. go test ./... -count=1 (gate)
#    5. ./build.sh all         (cross-compile 18 GOOS/GOARCH combos
#                                + dist/sha256_checksums.txt)
#    6. softprops/action-gh-release@v2 attaches dist/* to Release
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x ./build.sh
          ./build.sh all

      - name: List build artifacts
        run: |
          echo "==> dist/"
          ls -lh dist/
          echo ""
          echo "==> dist/sha256_checksums.txt"
          cat dist/sha256_checksums.txt

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
